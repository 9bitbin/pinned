<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Polyglot</title>
<style>
  :root { --ink:#201a2e; --bg:#f3eefb; --accent:#8e4ec6; --good:#30a46c; --mid:#f5a524; --bad:#e5484d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    -webkit-tap-highlight-color:transparent; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding:14px 16px calc(env(safe-area-inset-bottom) + 14px); gap:10px; }
  .hud { display:flex; gap:12px; justify-content:center; font-weight:800; font-size:14px; flex-wrap:wrap; }
  .hud b { color:var(--accent); }
  .lang-row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .lang-row button { border:1.5px solid #e2d5f2; background:#fff; border-radius:999px; padding:7px 13px; font-weight:800; font-size:13px; color:var(--ink); }
  .lang-row button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;
    background:#fff; border-radius:20px; padding:20px; box-shadow:0 10px 26px -14px rgba(60,20,90,.4); }
  .script { font-size:40px; font-weight:800; line-height:1.2; }
  .roman { font-size:20px; color:var(--accent); font-style:italic; }
  .en { font-size:16px; color:#6b6478; }
  .heard { font-size:15px; min-height:1.3em; color:#8a8398; }
  .verdict { font-size:22px; font-weight:900; min-height:1.2em; }
  .verdict.good { color:var(--good);} .verdict.mid { color:var(--mid);} .verdict.bad{color:var(--bad);}
  .mic { width:82px; height:82px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:34px; box-shadow:0 8px 20px -6px rgba(142,78,198,.6); }
  .mic.live { animation:pulse 1s infinite; background:var(--bad); }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(229,72,77,.5);} 50%{ box-shadow:0 0 0 14px rgba(229,72,77,0);} }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn { border:0; border-radius:999px; font-weight:800; font-size:16px; padding:12px 22px; background:var(--accent); color:#fff; }
  .btn.ghost { background:#efe6fa; color:var(--accent); }
  .btn.good{background:var(--good);} .btn.mid{background:var(--mid);} .btn.bad{background:var(--bad);}
  .btn:disabled { opacity:.45; }
  .mode-note { font-size:12px; color:#8a8398; text-align:center; }
  .panel { position:fixed; inset:0; display:grid; place-items:center; padding:24px; }
  .card { background:#fff; border-radius:20px; padding:22px; width:min(340px,100%); text-align:center; box-shadow:0 14px 30px -12px rgba(60,20,90,.4); }
  .card h1 { margin:0 0 6px; font-size:28px; } .card p { margin:6px 0; color:#6b6478; line-height:1.4; }
  .big { font-size:44px; font-weight:900; color:var(--accent); }
  [hidden]{display:none!important;}
</style>
<script src="bridge.js"></script>
</head>
<body>
<div id="wrap" hidden>
  <div class="hud">
    <div>Round <b id="round">1</b>/<b id="rounds">5</b></div>
    <div>Total <b id="total">0</b></div>
  </div>
  <div class="lang-row" id="langRow"></div>
  <div class="stage">
    <div class="script" id="script">—</div>
    <div class="roman" id="roman"></div>
    <div class="en" id="en"></div>
    <div class="verdict" id="verdict"></div>
    <div class="heard" id="heard"></div>
  </div>
  <div class="row" id="speakRow">
    <button class="btn ghost" id="listenBtn">🔊 Listen</button>
    <button class="mic" id="micBtn" aria-label="Speak">🎤</button>
    <button class="btn ghost" id="skipBtn">Skip</button>
  </div>
  <div class="row" id="judgeRow" hidden>
    <button class="btn good" data-j="100">Nailed it</button>
    <button class="btn mid" data-j="60">Close</button>
    <button class="btn bad" data-j="20">Missed</button>
  </div>
  <div class="row" id="nextRow" hidden>
    <button class="btn" id="nextBtn">Next →</button>
  </div>
  <p class="mode-note" id="modeNote"></p>
</div>

<div class="panel" id="startPanel">
  <div class="card">
    <h1>🗣️ Polyglot</h1>
    <p>Say the phrase out loud in the target language. The closer and quicker, the higher you score — 5 rounds.</p>
    <p class="mode-note" id="startMode"></p>
    <div class="lang-row" id="startLangs" style="margin:12px 0"></div>
    <button class="btn" id="startBtn">Start</button>
  </div>
</div>
<div class="panel" id="overPanel" hidden>
  <div class="card">
    <h1>Nicely spoken! 🎉</h1>
    <div class="big" id="finalScore">0</div>
    <p id="finalSub"></p>
    <button class="btn" id="againBtn">Play again</button>
    <p id="waitMsg" hidden>Waiting for everyone to finish…</p>
  </div>
</div>
<script>
(() => {
  const PB = window.PB;
  const $ = (id)=>document.getElementById(id);
  const ROUNDS = 5, WINDOW_MS = 6000, CAP = 130;

  // phrase banks: match is done against `s` (the native script)
  const LANGS = {
    en: { name:"English", tag:"en-US", bank:[
      {s:"Good morning",r:"good morning",e:"Good morning",d:1},
      {s:"Thank you very much",r:"thank you very much",e:"Thank you very much",d:1},
      {s:"How are you today",r:"how are you today",e:"How are you today",d:2},
      {s:"I would like some water",r:"",e:"I would like some water",d:2},
      {s:"See you tomorrow",r:"",e:"See you tomorrow",d:2},
      {s:"The weather is lovely",r:"",e:"The weather is lovely",d:3},
    ]},
    es: { name:"Español", tag:"es-ES", bank:[
      {s:"Hola",r:"o-la",e:"Hello",d:1},
      {s:"Buenos días",r:"bweh-nos dee-as",e:"Good morning",d:1},
      {s:"Gracias",r:"grah-syas",e:"Thank you",d:1},
      {s:"¿Cómo estás?",r:"koh-mo es-tas",e:"How are you?",d:2},
      {s:"Me gustaría un café",r:"meh goos-ta-ree-a oon ka-feh",e:"I'd like a coffee",d:2},
      {s:"Hasta mañana",r:"as-ta man-ya-na",e:"See you tomorrow",d:2},
      {s:"Mucho gusto en conocerte",r:"",e:"Nice to meet you",d:3},
    ]},
    zh: { name:"中文", tag:"zh-CN", bank:[
      {s:"你好",r:"nǐ hǎo",e:"Hello",d:1},
      {s:"谢谢",r:"xièxie",e:"Thank you",d:1},
      {s:"早上好",r:"zǎoshang hǎo",e:"Good morning",d:1},
      {s:"你好吗",r:"nǐ hǎo ma",e:"How are you?",d:2},
      {s:"我想喝水",r:"wǒ xiǎng hē shuǐ",e:"I want to drink water",d:2},
      {s:"明天见",r:"míngtiān jiàn",e:"See you tomorrow",d:2},
      {s:"很高兴认识你",r:"hěn gāoxìng rènshi nǐ",e:"Nice to meet you",d:3},
    ]},
    ne: { name:"नेपाली", tag:"ne-NP", bank:[
      {s:"नमस्ते",r:"namaste",e:"Hello",d:1},
      {s:"धन्यवाद",r:"dhanyabad",e:"Thank you",d:1},
      {s:"तपाईंलाई कस्तो छ",r:"tapaī̃lāī kasto cha",e:"How are you?",d:2},
      {s:"मलाई पानी चाहियो",r:"malai pani chahiyo",e:"I need water",d:2},
      {s:"भोलि भेटौंला",r:"bholi bhetaula",e:"See you tomorrow",d:3},
    ]},
    fr: { name:"Français", tag:"fr-FR", bank:[
      {s:"Bonjour",r:"bon-zhoor",e:"Hello / Good day",d:1},
      {s:"Merci beaucoup",r:"mair-see bo-koo",e:"Thank you very much",d:1},
      {s:"Comment ça va?",r:"ko-mon sa va",e:"How's it going?",d:2},
      {s:"Je voudrais un café",r:"zhuh voo-dray un ka-fay",e:"I'd like a coffee",d:2},
      {s:"À demain",r:"a duh-man",e:"See you tomorrow",d:2},
      {s:"Enchanté de vous rencontrer",r:"",e:"Pleased to meet you",d:3},
    ]},
    hi: { name:"हिन्दी", tag:"hi-IN", bank:[
      {s:"नमस्ते",r:"namaste",e:"Hello",d:1},
      {s:"धन्यवाद",r:"dhanyavaad",e:"Thank you",d:1},
      {s:"आप कैसे हैं",r:"aap kaise hain",e:"How are you?",d:2},
      {s:"मुझे पानी चाहिए",r:"mujhe paani chaahiye",e:"I need water",d:2},
      {s:"कल मिलते हैं",r:"kal milte hain",e:"See you tomorrow",d:3},
    ]},
  };
  const LKEYS = Object.keys(LANGS);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micOk = !!SR;           // may flip to false if it errors / permission denied
  const TTS = ("speechSynthesis" in window);

  let lang = "en", rng, order, idx, total, phase="intro", rec=null, startT=0, scored=false;

  // ---- scoring ----
  function norm(s) { return (s||"").toLowerCase().replace(/[.,!?¿¡;:"'’()\-]/g,"").replace(/\s+/g," ").trim(); }
  function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=0;j<=n;j++)d[0][j]=j;
    for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);} return d[m][n]; }
  function similarity(said, target, key) {
    let a=norm(said), b=norm(target);
    if (key==="zh") { a=a.replace(/\s/g,""); b=b.replace(/\s/g,""); }   // chars, no spaces
    if (!a||!b) return 0;
    const dist=lev(a,b); return Math.max(0, 1 - dist/Math.max(a.length,b.length));
  }
  function scoreRound(said, target, elapsed) {
    const acc = Math.round(100*similarity(said, target, lang));
    let bonus = 0;
    if (acc>=60) bonus = Math.round(30*Math.max(0,Math.min(1,(WINDOW_MS-elapsed)/WINDOW_MS)));
    return { acc, bonus, score: Math.min(CAP, acc+bonus) };
  }

  // ---- ui ----
  function buildLangRow(el, onPick) {
    el.innerHTML="";
    for (const k of LKEYS) { const b=document.createElement("button"); b.textContent=LANGS[k].name; b.setAttribute("aria-pressed",String(k===lang)); b.onclick=()=>{ lang=k; onPick&&onPick(); }; el.appendChild(b); }
  }
  function showPrompt() {
    const p = LANGS[lang].bank[order[idx]];
    $("script").textContent=p.s; $("roman").textContent=p.r||""; $("en").textContent=p.e;
    $("verdict").textContent=""; $("verdict").className="verdict"; $("heard").textContent="";
    $("round").textContent=idx+1; $("rounds").textContent=ROUNDS; $("total").textContent=total;
    $("speakRow").hidden = !micOk; $("judgeRow").hidden = micOk; $("nextRow").hidden = true;
    $("modeNote").textContent = micOk ? "Tap 🎤 and say it out loud" : "Practice mode (no mic here) — rate yourself honestly";
    scored=false;
    document.querySelectorAll("#langRow button").forEach((b,i)=>b.setAttribute("aria-pressed",String(LKEYS[i]===lang)));
  }
  function applyScore(sc, heardText) {
    if (scored) return; scored=true;
    total += sc.score; $("total").textContent=total;
    const v=$("verdict"); const cls = sc.acc>=85?"good":sc.acc>=60?"mid":"bad";
    v.className="verdict "+cls; v.textContent = (sc.acc>=85?"✅ ":sc.acc>=60?"➖ ":"❌ ") + `+${sc.score}`;
    if (heardText!=null) $("heard").textContent = heardText ? `heard: "${heardText}"` : "didn't catch that";
    $("speakRow").hidden=true; $("judgeRow").hidden=true; $("nextRow").hidden=false;
    report();
  }
  function report(){ PB.state({ d: idx, score: total, alive: phase==="play" }); }

  // ---- speech ----
  function listen() {
    const p = LANGS[lang].bank[order[idx]];
    if (!TTS) return;
    try { speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(p.s); u.lang=LANGS[lang].tag; u.rate=.9; speechSynthesis.speak(u); } catch(e){}
  }
  function startMic() {
    if (!micOk || scored) return;
    const p = LANGS[lang].bank[order[idx]];
    let rr; try { rr=new SR(); } catch(e){ micOk=false; showPrompt(); return; }
    rec=rr; rr.lang=LANGS[lang].tag; rr.interimResults=true; rr.maxAlternatives=3; rr.continuous=false;
    let best="", done=false;
    const finish=(heard)=>{ if(done)return; done=true; $("micBtn").classList.remove("live");
      if(!norm(heard)){ $("heard").textContent="didn't catch that — try again, or rate yourself"; $("judgeRow").hidden=false; return; }
      const elapsed=Date.now()-startT; applyScore(scoreRound(heard,p.s,elapsed), heard); };
    rr.onresult=(e)=>{ let t=""; for(let i=0;i<e.results.length;i++){ let b=e.results[i][0].transcript; for(let a=0;a<e.results[i].length;a++){ const alt=e.results[i][a].transcript; if (similarity(alt,p.s,lang)>similarity(b,p.s,lang)) b=alt; } t+=b; } best=t; $("heard").textContent=t?`… ${t}`:""; if(e.results[e.results.length-1].isFinal) finish(best); };
    rr.onerror=(e)=>{ $("micBtn").classList.remove("live"); if(e.error==="not-allowed"||e.error==="service-not-allowed"){ micOk=false; showPrompt(); $("modeNote").textContent="Mic blocked — switched to practice mode. Allow the microphone in settings to score by voice."; } else if(!done){ done=true; applyScore(scoreRound(best,p.s,WINDOW_MS),best); } };
    rr.onend=()=>{ $("micBtn").classList.remove("live"); if(!done) finish(best); };
    try { startT=Date.now(); rr.start(); $("micBtn").classList.add("live"); setTimeout(()=>{ try{rr.stop();}catch(e){} }, WINDOW_MS); }
    catch(e){ micOk=false; showPrompt(); }
  }

  function nextRound() {
    idx++;
    if (idx>=ROUNDS) { finish(); return; }
    showPrompt();
  }
  function begin() {
    rng = PB.rng(PB.race ? PB.seed : (Math.random()*4294967296)>>>0);
    const bank=LANGS[lang].bank, n=bank.length;
    order=[]; const used=new Set();
    while(order.length<ROUNDS){ const k=Math.floor(rng()*n); if(!used.has(k)||used.size>=n){ order.push(k); used.add(k);} }
    idx=0; total=0; phase="play";
    $("startPanel").hidden=true; $("overPanel").hidden=true; $("wrap").hidden=false;
    buildLangRow($("langRow"), ()=>{ /* lang can't change mid-run */ });
    document.querySelectorAll("#langRow button").forEach(b=>b.disabled=true);
    showPrompt(); report();
  }
  function finish() {
    phase="over";
    PB.send("over",{score:total});
    const best=Math.max(total,+(localStorage.getItem("pinned.speak.best")||0));
    try{localStorage.setItem("pinned.speak.best",best);}catch(e){}
    $("finalScore").textContent=total;
    $("finalSub").textContent=`${LANGS[lang].name} · ${micOk?"voice":"practice"} mode`+(PB.race?"":` · best ${best}`);
    $("againBtn").hidden=PB.race; $("waitMsg").hidden=!PB.race;
    $("overPanel").hidden=false;
  }

  // wire
  $("micBtn").onclick=startMic;
  $("listenBtn").onclick=listen;
  $("skipBtn").onclick=()=>{ if(!scored) applyScore({acc:0,bonus:0,score:0}, null); };
  $("nextBtn").onclick=nextRound;
  $("judgeRow").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(scored)return; const j=+b.dataset.j; applyScore({acc:j,bonus:0,score:j}, null); });
  $("againBtn").onclick=begin;
  $("startBtn").onclick=begin;
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ try{rec&&rec.stop();}catch(e){} try{speechSynthesis.cancel();}catch(e){} } });

  // start panel
  buildLangRow($("startLangs"));
  $("startMode").textContent = micOk ? "Voice scoring is on for this device 🎤" : "This device can't score by voice — you'll play in practice mode (rate yourself). Tip: use the 🔊 Listen button to hear each phrase.";
  if (PB.race) { $("startPanel").hidden=true; PB.on("go", begin); }
  window.__total=()=>total; window.__order=()=>order; window.__lang=()=>lang; window.__score=(a,b,e)=>scoreRound(a,b,e);
})();
</script>
</body>
</html>
