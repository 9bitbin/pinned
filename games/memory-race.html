<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Race</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1030; color: #fbf3ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; }
  .top { width: min(94vw, 420px); display: flex; justify-content: space-between; font-weight: 700; }
  .grid { width: min(94vw, 420px); display: grid; gap: 8px; }
  .card { aspect-ratio: 1; border-radius: 14px; border: 0; font-size: 28px; background: #3a2360; color: transparent; transition: transform .25s; }
  .card.up, .card.gone { color: #fff; background: #5c3b9a; }
  .card.gone { opacity: .35; }
  button { font: inherit; font-weight: 700; color: #1b1030; background: #ffd166; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 44px; }
  .status { min-height: 1.4em; font-size: 15px; color: #e5d5ff; text-align: center; }
  .hint { font-size: 13px; color: #b9a6d8; text-align: center; max-width: 420px; }
</style>
</head>
<body>
<div class="top"><span>Moves <b id="moves">0</b></span><span>Time <b id="time">0</b>s</span></div>
<div class="grid" id="grid"></div>
<div class="status" id="status">Find the pairs.</div>
<button id="again">New game</button>
<p class="hint">Tap two cards. Match a pair to keep it. Fewer moves and a faster time score more.</p>
<script type="module">
import { makeDeck, scoreFor } from './lib/memory.js';

const PAIRS = 8, COLS = 4;
const gridEl = document.getElementById('grid');
let deck, first = null, lock = false, moves = 0, left = PAIRS, t0 = 0, timer = null, finished = false;

function report(score) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ pinned: 1, t: 'over', score }, location.origin); } catch (e) {}
}

function render() {
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  gridEl.innerHTML = '';
  deck.forEach((card, i) => {
    const b = document.createElement('button');
    b.className = 'card' + (card.up ? ' up' : '') + (card.gone ? ' gone' : '');
    b.textContent = card.up || card.gone ? card.s : '?';
    b.setAttribute('aria-label', card.up || card.gone ? card.s : 'Hidden card');
    b.onclick = () => flip(i);
    gridEl.appendChild(b);
  });
}

function flip(i) {
  const card = deck[i];
  if (lock || card.up || card.gone || finished) return;
  if (!t0) { t0 = Date.now(); timer = setInterval(tick, 500); }
  card.up = true;
  render();
  if (!first) { first = i; return; }
  moves++;
  document.getElementById('moves').textContent = moves;
  const other = deck[first];
  if (other.s === card.s) {
    card.gone = other.gone = true; card.up = other.up = false;
    first = null; left--;
    render();
    if (left === 0) win();
  } else {
    lock = true;
    setTimeout(() => {
      other.up = card.up = false; first = null; lock = false; render();
    }, 800);
  }
}

function tick() { document.getElementById('time').textContent = Math.floor((Date.now() - t0) / 1000); }

function win() {
  finished = true; clearInterval(timer); tick();
  const secs = Math.floor((Date.now() - t0) / 1000);
  const score = scoreFor(moves, secs);
  document.getElementById('status').textContent = `Done in ${moves} moves and ${secs}s. Score ${score}.`;
  report(score);
}

function newGame() {
  deck = makeDeck(PAIRS);
  first = null; lock = false; moves = 0; left = PAIRS; t0 = 0; finished = false;
  clearInterval(timer);
  document.getElementById('moves').textContent = 0;
  document.getElementById('time').textContent = 0;
  document.getElementById('status').textContent = 'Find the pairs.';
  render();
}
document.getElementById('again').onclick = newGame;
newGame();
</script>
</body>
</html>
