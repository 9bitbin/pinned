<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marble Maze</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; touch-action: none; }
  #top { position: fixed; top: 10px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; pointer-events: none; text-shadow: 0 2px 8px #000; }
  #tilt { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfd8e3; pointer-events: none; text-shadow: 0 2px 8px #000; }
  #ask { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); }
  button { font: inherit; font-weight: 700; color: #101418; background: #ffd166; border: 0; border-radius: 14px; padding: 10px 16px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="top">Roll the marble into the green hole</div>
<div id="tilt">Drag, use arrow keys, or tilt your phone. Hit a wall and you lose a second.</div>
<button id="ask" hidden>Enable tilt</button>
<script type="module">
import * as THREE from 'three';

// 0 wall, 1 floor. S = start, G = goal.
const MAP = [
  '11111111111',
  '1S100000001',
  '10111110101',
  '10100010101',
  '10101110101',
  '10001000101',
  '11111011101',
  '10000010001',
  '10111011111',
  '10001000G01',
  '11111111111',
];
const ROWS = MAP.length, COLS = MAP[0].length;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(3, 10, 4); scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS, ROWS), new THREE.MeshStandardMaterial({ color: 0x1d2a33 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(COLS / 2 - 0.5, 0, ROWS / 2 - 0.5); scene.add(floor);
const wallGeo = new THREE.BoxGeometry(1, 0.8, 1), wallMat = new THREE.MeshStandardMaterial({ color: 0x5b7389 });
let start = [0, 0], goal = [0, 0];
MAP.forEach((row, r) => [...row].forEach((ch, c) => {
  if (ch === '1' || ch === '0') return;
  if (ch === 'S') start = [r, c];
  if (ch === 'G') goal = [r, c];
}));
MAP.forEach((row, r) => [...row].forEach((ch, c) => {
  if (ch === '1') { const w = new THREE.Mesh(wallGeo, wallMat); w.position.set(c, 0.4, r); scene.add(w); }
}));
const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.05, 24), new THREE.MeshStandardMaterial({ color: 0x2ecc71 }));
hole.position.set(goal[1], 0.03, goal[0]); scene.add(hole);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 16), new THREE.MeshStandardMaterial({ color: 0xffd166, metalness: 0.4, roughness: 0.2 }));
scene.add(ball);

let pos = { x: start[1], z: start[0] }, vel = { x: 0, z: 0 }, tilt = { x: 0, z: 0 };
let t0 = performance.now(), elapsed = 0, penalty = 0, done = false, reported = false;
const topEl = document.getElementById('top');

function report(score) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ pinned: 1, t: 'over', score }, location.origin); } catch (e) {}
}

// Input: keys, drag, or device tilt
const keys = {};
addEventListener('keydown', (e) => { keys[e.key] = true; });
addEventListener('keyup', (e) => { keys[e.key] = false; });
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { drag = null; tilt.x = tilt.z = 0; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!drag) return;
  tilt.x = Math.max(-1, Math.min(1, (e.clientX - drag.x) / 120));
  tilt.z = Math.max(-1, Math.min(1, (e.clientY - drag.y) / 120));
});
addEventListener('deviceorientation', (e) => {
  if (e.gamma == null) return;
  tilt.x = Math.max(-1, Math.min(1, e.gamma / 30));
  tilt.z = Math.max(-1, Math.min(1, e.beta / 30 - 0.4));
});
const askBtn = document.getElementById('ask');
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
  askBtn.hidden = false;
  askBtn.onclick = async () => { try { await DeviceOrientationEvent.requestPermission(); askBtn.hidden = true; } catch (e) {} };
}

function cellAt(x, z) {
  const c = Math.round(x), r = Math.round(z);
  if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return '1';
  return MAP[r][c];
}

function collide(nx, nz) {
  // circle vs. grid walls: check the cells around the ball
  const rad = 0.28;
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const cr = Math.round(nz) + dz, cc = Math.round(nx) + dx;
    if (cellAt(cc, cr) !== '1') continue;
    const minX = cc - 0.5, maxX = cc + 0.5, minZ = cr - 0.5, maxZ = cr + 0.5;
    const px = Math.max(minX, Math.min(nx, maxX)), pz = Math.max(minZ, Math.min(nz, maxZ));
    const ddx = nx - px, ddz = nz - pz, d2 = ddx * ddx + ddz * ddz;
    if (d2 < rad * rad) return { hit: true, px, pz, ddx, ddz, d2 };
  }
  return { hit: false };
}

function win() {
  done = true;
  const secs = (performance.now() - t0) / 1000 + penalty;
  const score = Math.max(0, Math.round(600 - secs * 10));
  topEl.textContent = `Finished in ${secs.toFixed(1)}s. Score ${score}.`;
  if (!reported) { reported = true; report(score); }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!done) {
    let ax = tilt.x, az = tilt.z;
    if (keys.ArrowLeft) ax -= 1; if (keys.ArrowRight) ax += 1;
    if (keys.ArrowUp) az -= 1; if (keys.ArrowDown) az += 1;
    vel.x += ax * 9 * dt; vel.z += az * 9 * dt;
    vel.x *= 0.985; vel.z *= 0.985;
    let nx = pos.x + vel.x * dt, nz = pos.z + vel.z * dt;
    const c = collide(nx, nz);
    if (c.hit) {
      // slide along the wall and lose a little time on hard hits
      if (c.d2 > 0) { const d = Math.sqrt(c.d2), push = 0.28 - d; nx += (c.ddx / d) * push; nz += (c.ddz / d) * push; }
      if (Math.hypot(vel.x, vel.z) > 3) penalty += 0.5;
      vel.x *= 0.4; vel.z *= 0.4;
    }
    pos.x = nx; pos.z = nz;
    if (Math.hypot(pos.x - goal[1], pos.z - goal[0]) < 0.3) { ball.position.set(goal[1], 0.28, goal[0]); return win(); }
    elapsed = (now - t0) / 1000 + penalty;
    topEl.textContent = `Time ${elapsed.toFixed(1)}s`;
  }
  ball.position.set(pos.x, 0.28, pos.z);
  camera.position.set(pos.x + 0.001, 9, pos.z + 5);
  camera.lookAt(pos.x, 0, pos.z);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
pos = { x: start[1], z: start[0] };
requestAnimationFrame(loop);
</script>
</body>
</html>
