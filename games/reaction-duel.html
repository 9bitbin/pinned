<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reaction Duel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #f2f7ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 16px; }
  #pad { width: min(90vw, 360px); aspect-ratio: 1; border-radius: 28px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 22px; font-weight: 700; padding: 20px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #pad.ready { background: #7a1f2b; }
  #pad.go { background: #1f9d55; color: #fff; }
  #pad.wait { background: #202a36; }
  #pad.early { background: #5a4a10; }
  .info { font-size: 15px; color: #a8bdd3; text-align: center; min-height: 1.4em; }
  .big { font-size: 38px; font-weight: 800; }
  button { font: inherit; font-weight: 700; color: #0b0f14; background: #5ad1ff; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 44px; }
  .hint { font-size: 13px; color: #7f97b0; text-align: center; max-width: 380px; }
</style>
</head>
<body>
<div id="pad" class="wait" role="button" aria-label="Reaction pad">Tap to start</div>
<div class="info" id="info">Five rounds. Wait for green.</div>
<div class="info" id="best">Best: —</div>
<button id="again" hidden>Play again</button>
<p class="hint">When the pad turns green, tap as fast as you can. Tapping early is a false start.</p>
<script type="module">
import { randomDelay, scoreFor } from './lib/reaction.js';

const ROUNDS = 5;
const pad = document.getElementById('pad');
const info = document.getElementById('info');
const bestEl = document.getElementById('best');
const again = document.getElementById('again');
let state = 'idle', timer = null, goAt = 0, times = [], round = 0;

function report(score) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ pinned: 1, t: 'over', score }, location.origin); } catch (e) {}
}

function setPad(cls, text) { pad.className = cls; pad.textContent = text; }

function startRound() {
  round++;
  state = 'wait';
  setPad('ready', 'Wait for green…');
  info.textContent = `Round ${round} of ${ROUNDS}`;
  timer = setTimeout(() => {
    state = 'go'; goAt = performance.now();
    setPad('go', 'TAP!');
  }, randomDelay());
}

pad.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state === 'idle') { times = []; round = 0; return startRound(); }
  if (state === 'wait') {
    clearTimeout(timer);
    setPad('early', 'Too early! Wait for green.');
    info.textContent = 'False start. Try this round again.';
    round--;
    state = 'early';
    setTimeout(() => { if (state === 'early') { state = 'idle'; setPad('wait', 'Tap to try again'); } }, 900);
    return;
  }
  if (state === 'go') {
    const ms = Math.round(performance.now() - goAt);
    times.push(ms);
    if (times.length >= ROUNDS) return finish();
    state = 'between';
    setPad('wait', `${ms} ms`);
    setTimeout(() => { if (state === 'between') startRound(); }, 900);
  }
});

function finish() {
  state = 'done';
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  const score = scoreFor(avg);
  setPad('wait', `Average ${avg} ms`);
  info.textContent = `Your times: ${times.join(' · ')} ms`;
  bestEl.textContent = `Score ${score}`;
  again.hidden = false;
  report(score);
}

again.onclick = () => { state = 'idle'; round = 0; times = []; again.hidden = true; bestEl.textContent = 'Best: —'; setPad('wait', 'Tap to start'); info.textContent = 'Five rounds. Wait for green.'; };
</script>
</body>
</html>
